<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D</title><style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;perspective:900px;background:#dfeaff;font-family:sans-serif}.scene{position:absolute;left:50%;top:55%;transform-style:preserve-3d}.floor{position:absolute;width:1000px;height:1000px;left:-500px;top:-500px;background:conic-gradient(#2b2d42 25%,#3d405b 0 50%,#2b2d42 0 75%,#3d405b 0) 0 0/100px 100px}.wh{position:absolute;width:28px;height:28px;left:-14px;top:-14px;border-radius:50%;background:linear-gradient(90deg,#111 45%,#aaa 45% 55%,#111 55%);animation:wspin .5s linear infinite}@keyframes wspin{to{transform:rotate(360deg)}}@keyframes spinY{to{transform:rotateY(360deg)}}@keyframes drive{from{transform:translateX(-450px)}to{transform:translateX(450px)}}
body{background:linear-gradient(#02041a,#16235e)}
#s{animation:sway 10s ease-in-out infinite alternate}
.moon{position:absolute;left:-55px;top:-55px;width:110px;height:110px;border-radius:50%;overflow:hidden;background:#e9e4c8;box-shadow:0 0 70px #fff8;animation:arc 14s linear infinite}
.moon:before{content:"";position:absolute;inset:0;background:radial-gradient(circle 10px at 25% 30%,#b9b392 90%,#0000),radial-gradient(circle 16px at 65% 65%,#b9b392 90%,#0000),radial-gradient(circle 7px at 85% 25%,#b9b392 90%,#0000);background-size:110px 110px;animation:tex 8s linear infinite}
.moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,#0000,#000a 80%)}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff}
@keyframes tex{to{background-position:110px 0}}
@keyframes sway{from{transform:rotateY(-8deg)}to{transform:rotateY(8deg)}}
@keyframes arc{0%{transform:translate3d(-55vw,20vh,-500px)}50%{transform:translate3d(0,-25vh,150px)}100%{transform:translate3d(55vw,20vh,-500px)}}
</style></head><body><div class="scene" id="s"></div><script>
var s=document.getElementById('s');s.innerHTML='<div class="moon"></div>';
for(var i=0;i<120;i++){var d=document.createElement('div');d.className='st';d.style.transform='translate3d('+(Math.random()*1800-900)+'px,'+(Math.random()*900-550)+'px,'+(-Math.random()*1200)+'px)';s.appendChild(d)}
</script></body></html>
