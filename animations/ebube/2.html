<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat and mouse</title>
<style>
  :root { --bg:#f6f5f1; --card:#ffffff; --ink:#2c2c2a; --muted:#5f5e5a; --line:#d3d1c7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1e1c; --card:#2a2927; --ink:#f1efe8; --muted:#b4b2a9; --line:#444441; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; display:flex; flex-direction:column; gap:20px; }
  h1 { font-size:22px; font-weight:500; margin:0 0 4px; }
  figure { margin:0; background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:12px; }
  figcaption { font-size:14px; color:var(--muted); padding:4px 4px 0; }
  svg { width:100%; height:auto; display:block; }
  .t { font-size:14px; fill:var(--ink); }
  .ts { font-size:12px; fill:var(--muted); }
  .th { font-size:14px; font-weight:500; fill:#2c2c2a; }
  .bubble { fill:#ffffff; stroke:#888780; stroke-width:0.8; }
  button { font:inherit; font-size:14px; padding:8px 14px; border-radius:8px; border:0.5px solid var(--line);
           background:transparent; color:var(--ink); cursor:pointer; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Cat and mouse</h1>
  <figure>
    <svg viewBox="0 0 380 300" role="img" aria-label="A cat watching a mouse run in a circle around it">
      <path d="M325,160 A135,70 0 1 1 55,160 A135,70 0 1 1 325,160" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
      <g>
        <path d="M218,185 C250,185 255,150 240,140" fill="none" stroke="#EF9F27" stroke-width="9" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="-12 218 185;14 218 185;-12 218 185" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <ellipse cx="190" cy="178" rx="34" ry="30" fill="#EF9F27" stroke="#854F0B"/>
        <ellipse cx="190" cy="186" rx="18" ry="16" fill="#FAEEDA"/>
        <polygon points="168,118 172,92 190,110" fill="#EF9F27" stroke="#854F0B"/>
        <polygon points="212,118 208,92 190,110" fill="#EF9F27" stroke="#854F0B"/>
        <circle cx="190" cy="134" r="27" fill="#EF9F27" stroke="#854F0B"/>
        <circle cx="180" cy="130" r="7" fill="#fff"/>
        <circle cx="200" cy="130" r="7" fill="#fff"/>
        <circle r="3.2" fill="#2C2C2A">
          <animate attributeName="cx" values="182.5;180;177.5;180;182.5" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="130;132.5;130;127.5;130" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle r="3.2" fill="#2C2C2A">
          <animate attributeName="cx" values="202.5;200;197.5;200;202.5" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="130;132.5;130;127.5;130" dur="6s" repeatCount="indefinite"/>
        </circle>
        <polygon points="187,140 193,140 190,144" fill="#D4537E"/>
        <path d="M190,144 L190,148 M190,148 Q185,152 181,149 M190,148 Q195,152 199,149" fill="none" stroke="#712B13"/>
        <path d="M170,142 L152,138 M170,146 L152,148 M210,142 L228,138 M210,146 L228,148" stroke="#712B13" stroke-width="0.8"/>
        <ellipse cx="172" cy="200" rx="9" ry="6" fill="#EF9F27" stroke="#854F0B"/>
        <ellipse cx="208" cy="200" rx="9" ry="6" fill="#EF9F27" stroke="#854F0B"/>
      </g>
      <g>
        <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" path="M325,160 A135,70 0 1 1 55,160 A135,70 0 1 1 325,160"/>
        <path d="M-12,0 Q-20,-6 -26,2" fill="none" stroke="#D4537E" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="0" rx="12" ry="7" fill="#888780" stroke="#444441" stroke-width="0.8"/>
        <circle cx="10" cy="0" r="5.5" fill="#888780" stroke="#444441" stroke-width="0.8"/>
        <circle cx="7" cy="-5" r="4" fill="#D3D1C7" stroke="#444441" stroke-width="0.8"/>
        <circle cx="15" cy="0" r="1.8" fill="#D4537E"/>
        <circle cx="11" cy="-2" r="1" fill="#2C2C2A"/>
      </g>
    </svg>
    <figcaption>1. The cat's eyes follow the mouse running around it.</figcaption>
  </figure>
</main>
</body>
</html>
