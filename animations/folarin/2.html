<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rotating About Its Own Axis</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #18181b;
        }
        canvas {
            background: #27272a;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="600" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        let angle = 0;

        function drawTopDownCar() {
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath();
            ctx.roundRect(-55, -105, 120, 220, 25);
            ctx.fill();

            // Wheels
            ctx.fillStyle = '#09090b';
            ctx.fillRect(-58, -75, 14, 38); // Front Left
            ctx.fillRect(44, -75, 14, 38);  // Front Right
            ctx.fillRect(-58, 40, 14, 38);  // Rear Left
            ctx.fillRect(44, 40, 14, 38);   // Rear Right

            // Main Chassis
            const bodyGrad = ctx.createLinearGradient(-50, 0, 50, 0);
            bodyGrad.addColorStop(0, '#0284c7');
            bodyGrad.addColorStop(0.5, '#38bdf8');
            bodyGrad.addColorStop(1, '#0284c7');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(-48, -105, 96, 210, 22);
            ctx.fill();

            // Racing Stripes
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-14, -105, 10, 210);
            ctx.fillRect(4, -105, 10, 210);

            // Windshield
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(-38, -45);
            ctx.lineTo(38, -45);
            ctx.lineTo(32, -15);
            ctx.lineTo(-32, -15);
            ctx.closePath();
            ctx.fill();

            // Roof
            ctx.fillStyle = '#0369a1';
            ctx.beginPath();
            ctx.roundRect(-32, -15, 64, 65, 8);
            ctx.fill();

            // Rear Window
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(-32, 50);
            ctx.lineTo(32, 50);
            ctx.lineTo(36, 75);
            ctx.lineTo(-36, 75);
            ctx.closePath();
            ctx.fill();

            // Headlight Beams
            const beamGrad = ctx.createLinearGradient(0, -105, 0, -220);
            beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.5)');
            beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
            ctx.fillStyle = beamGrad;

            ctx.beginPath();
            ctx.moveTo(-35, -105);
            ctx.lineTo(-65, -220);
            ctx.lineTo(-10, -220);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(35, -105);
            ctx.lineTo(10, -220);
            ctx.lineTo(65, -220);
            ctx.closePath();
            ctx.fill();

            // Headlights & Taillights
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(-38, -106, 16, 5);
            ctx.fillRect(22, -106, 16, 5);

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-38, 101, 18, 5);
            ctx.fillRect(20, 101, 18, 5);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Turntable Platform
            ctx.beginPath();
            ctx.arc(cx, cy, 175, 0, Math.PI * 2);
            ctx.fillStyle = '#3f3f46';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#38bdf8';
            ctx.stroke();

            // Center Axis Marker
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // Platform Radial Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(170, 0);
                ctx.stroke();
            }

            drawTopDownCar();

            // Center Pivot Dot
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();

            ctx.restore();

            angle += 0.02;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
