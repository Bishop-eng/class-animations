<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Watching Mouse</title>
<style>
  html,body{margin:0;height:100%;background:#f3e3c3;overflow:hidden}
  svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg id="svg" viewBox="-300 -250 600 500" preserveAspectRatio="xMidYMid meet">
  <!-- rug (top-down view) -->
  <circle cx="0" cy="0" r="235" fill="#e8caa0"/>
  <circle cx="0" cy="0" r="200" fill="none" stroke="#c89b66" stroke-width="3" stroke-dasharray="6 8"/>
  <circle cx="0" cy="0" r="165" fill="none" stroke="#d4ac78" stroke-width="2" stroke-dasharray="2 10" opacity=".7"/>

  <!-- CAT, seen from above. Body and head rotate separately; both face +x at 0 degrees -->
  <g id="cat">
    <g id="body">
      <path id="tail" d="M-68 0 Q-100 20 -125 0" fill="none" stroke="#d98a3d" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="-30" cy="0" rx="48" ry="32" fill="#f0a24e"/>
      <path d="M-60 -22 Q-40 -10 -20 -26 M-65 0 Q-40 8 -15 0 M-60 22 Q-40 10 -20 26" stroke="#d98a3d" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
      <ellipse cx="-60" cy="-26" rx="14" ry="8" fill="#f0a24e" stroke="#d98a3d" stroke-width="2"/>
      <ellipse cx="-60" cy="26" rx="14" ry="8" fill="#f0a24e" stroke="#d98a3d" stroke-width="2"/>
      <ellipse id="pawL" cx="2" cy="-24" rx="14" ry="8" fill="#fbd9a8" stroke="#d98a3d" stroke-width="2"/>
      <ellipse id="pawR" cx="2" cy="24" rx="14" ry="8" fill="#fbd9a8" stroke="#d98a3d" stroke-width="2"/>
    </g>
    <g id="head">
      <polygon points="12,-18 4,-46 30,-30" fill="#f0a24e"/>
      <polygon points="12,18 4,46 30,30" fill="#f0a24e"/>
      <polygon points="14,-22 10,-38 24,-28" fill="#f4a6a6"/>
      <polygon points="14,22 10,38 24,28" fill="#f4a6a6"/>
      <ellipse cx="24" cy="0" rx="30" ry="28" fill="#f0a24e"/>
      <path d="M-2 -8 h14 M-3 0 h16 M-2 8 h14" stroke="#d98a3d" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="38" cy="-12" rx="9" ry="7" fill="#fff"/>
      <ellipse cx="38" cy="12" rx="9" ry="7" fill="#fff"/>
      <ellipse id="pL" cx="38" cy="-12" rx="6" ry="3.5" fill="#222"/>
      <ellipse id="pR" cx="38" cy="12" rx="6" ry="3.5" fill="#222"/>
      <polygon points="52,-4 52,4 59,0" fill="#e86a7a"/>
      <path d="M52 0 Q46 -6 42 -4 M52 0 Q46 6 42 4" fill="none" stroke="#7a4a1c" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M48 -6 l22 -12 M48 -4 l24 -2 M48 6 l22 12 M48 4 l24 2" stroke="#7a4a1c" stroke-width="1.3"/>
    </g>
  </g>

  <!-- MOUSE, from above, runs in a circle around the cat -->
  <g id="mouse">
    <path id="mtail" d="M-18 0 Q-34 -8 -44 0" fill="none" stroke="#e8a0a0" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#9aa0a6"/>
    <circle cx="8" cy="-10" r="6" fill="#e8a0a0"/>
    <circle cx="8" cy="10" r="6" fill="#e8a0a0"/>
    <ellipse cx="18" cy="0" rx="10" ry="7" fill="#aab0b6"/>
    <circle cx="27" cy="0" r="2.2" fill="#e86a7a"/>
    <circle cx="21" cy="-4" r="1.5" fill="#111"/><circle cx="21" cy="4" r="1.5" fill="#111"/>
    <circle id="foot1" cx="4" cy="-12" r="3" fill="#7d8389"/>
    <circle id="foot2" cx="4" cy="12" r="3" fill="#7d8389"/>
  </g>
</svg>
<script>
  const $ = id => document.getElementById(id);
  const body = $('body'), head = $('head'), tail = $('tail');
  const mouse = $('mouse'), mtail = $('mtail'), f1 = $('foot1'), f2 = $('foot2');
  const pL = $('pL'), pR = $('pR'), pawL = $('pawL'), pawR = $('pawR');
  const R = 165;                     // mouse circle radius around the cat
  let t = 0, headAng = 0, bodyAng = 0;

  // rotate toward target by the shortest path
  const turn = (a, b, k) => a + ((((b - a + 540) % 360) - 180) * k);

  function frame(){
    t += 0.014;
    const mx = Math.cos(t) * R, my = Math.sin(t) * R;

    // mouse runs along the circle, facing where it's going
    const heading = Math.atan2(Math.cos(t), -Math.sin(t)) * 180 / Math.PI;
    mouse.setAttribute('transform', `translate(${mx},${my}) rotate(${heading})`);
    f1.setAttribute('cx', 4 + Math.sin(t * 60) * 6);
    f2.setAttribute('cx', 4 - Math.sin(t * 60) * 6);
    mtail.setAttribute('d', `M-18 0 Q-34 ${Math.sin(t*25)*8} -44 ${Math.sin(t*25)*4}`);

    // the cat's HEAD snaps around to face the mouse; the BODY follows more slowly
    const target = Math.atan2(my, mx) * 180 / Math.PI;
    headAng = turn(headAng, target, 0.14);
    bodyAng = turn(bodyAng, headAng, 0.05);

    body.setAttribute('transform', `rotate(${bodyAng})`);
    const r = bodyAng * Math.PI / 180;
    const nx = Math.cos(r) * 10, ny = Math.sin(r) * 10;          // neck position
    head.setAttribute('transform', `translate(${nx},${ny}) rotate(${headAng})`);

    // pupils stay glued on the mouse
    const rel = (target - headAng) * Math.PI / 180;
    const off = Math.max(-2.5, Math.min(2.5, Math.sin(rel) * 4));
    pL.setAttribute('cy', -12 + off); pR.setAttribute('cy', 12 + off);

    // twitchy tail, creeping paws
    tail.setAttribute('d', `M-68 0 Q-100 ${20 + Math.sin(t*4) * 22} -125 ${Math.sin(t*4 + 1) * 14}`);
    pawL.setAttribute('cx', 2 + Math.sin(t * 3) * 3);
    pawR.setAttribute('cx', 2 - Math.sin(t * 3) * 3);

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
