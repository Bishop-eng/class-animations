<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5 · Car driving across the screen</title>
<style>

:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6a65;--line:#e2e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--text:#f0efea;--muted:#a3a29b;--line:#34332f}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--text:#f0efea;--muted:#a3a29b;--line:#34332f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600}
svg{width:100%;height:auto;display:block;border-radius:8px}
svg text{font-family:system-ui,sans-serif}



.drive{animation:drive 6s linear infinite}
@keyframes drive{from{transform:translateX(-100px)}to{transform:translateX(330px)}}
.w1{animation:spin .6s linear infinite;transform-origin:20px 148px}
.w2{animation:spin .6s linear infinite;transform-origin:62px 148px}
.road{stroke-dasharray:18 14;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:32}}


@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
<div class="card"><h2>5 · Car driving across the screen</h2>
<svg viewBox="0 0 320 200"><rect width="320" height="200" fill="#bbdefb"/>
<circle cx="270" cy="40" r="16" fill="#ffeb3b"/>
<rect y="158" width="320" height="42" fill="#455a64"/><line class="road" x1="0" y1="180" x2="320" y2="180" stroke="#fff" stroke-width="3"/>
<g class="drive">
<path d="M0 138q0-12 10-14l14-2 12-14h26l12 14 8 2q6 2 6 12v6H0z" fill="#e53935"/>
<path d="M30 122l9-11h12v11zM55 122v-11h12l8 11z" fill="#bbdefb"/>
<circle cx="20" cy="148" r="10" fill="#212121"/><circle cx="62" cy="148" r="10" fill="#212121"/>
<g class="w1"><circle cx="20" cy="148" r="5" fill="#bdbdbd"/><path d="M20 143v10M15 148h10" stroke="#555"/></g>
<g class="w2"><circle cx="62" cy="148" r="5" fill="#bdbdbd"/><path d="M62 143v10M57 148h10" stroke="#555"/></g>
<rect x="78" y="132" width="5" height="4" fill="#fff59d"/></g></svg></div>
</main>
</body>
</html>
