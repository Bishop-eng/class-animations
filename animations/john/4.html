<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball Animation</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#fff8e9;color:#45351f}
h1{margin-top:25px}.court{height:340px;max-width:650px;margin:30px auto;background:#fff;border:2px solid #e8c98d;border-radius:16px;position:relative;overflow:hidden}
.ball{position:absolute;left:calc(50% - 30px);top:20px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffdf70,#ed5b26 70%);animation:bounce 1.2s ease-in infinite}
.shadow{position:absolute;bottom:20px;left:calc(50% - 45px);width:90px;height:14px;background:#ddd;border-radius:50%;animation:shadow 1.2s ease-in infinite}
.floor{position:absolute;bottom:0;width:100%;height:20px;background:#b8d89a}
@keyframes bounce{0%,100%{top:20px}50%{top:245px}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(.5);opacity:.25}}
</style>
</head>
<body>
<h1>🏀 Bouncing Ball</h1>
<p>The ball moves up and down continuously.</p>
<div class="court"><div class="ball"></div><div class="shadow"></div><div class="floor"></div></div>
</body>
</html>
