<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moving Car Animation</title>
<style>
body{margin:0;background:#eaf5ff;font-family:Arial,sans-serif;text-align:center;color:#243447}
h1{margin-top:25px}.road{height:260px;max-width:800px;margin:35px auto;background:#777;position:relative;overflow:hidden;border-radius:14px;border:3px solid #555}
.line{position:absolute;top:125px;width:100%;border-top:6px dashed white}
.car{position:absolute;top:78px;left:-150px;font-size:95px;animation:drive 6s linear infinite}
@keyframes drive{from{left:-150px}to{left:calc(100% + 20px)}}
</style>
</head>
<body>
<h1>🚘 Moving Car</h1>
<p>The car moves from the left side to the right side of the road.</p>
<div class="road"><div class="line"></div><div class="car">🚙</div></div>
</body>
</html>
