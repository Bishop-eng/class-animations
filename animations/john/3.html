<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dramatic Robot Conversation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;text-align:center}
h1{padding-top:22px}.stage{position:relative;max-width:760px;height:390px;margin:20px auto;background:linear-gradient(#283b60,#101827);border:3px solid #7185aa;border-radius:18px;overflow:hidden}
.spotlight{position:absolute;width:280px;height:390px;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,235,170,.25),transparent 70%)}
.robot{position:absolute;bottom:34px;left:22%;width:125px;height:150px;animation:shake 2.5s infinite}
.head{width:95px;height:75px;margin:auto;background:#c7d2e2;border:5px solid #64748b;border-radius:24px;position:relative}
.eye{position:absolute;top:25px;width:12px;height:12px;border-radius:50%;background:#16d9ff}.eye.one{left:20px}.eye.two{right:20px}
.body{width:115px;height:85px;margin:5px auto;background:#9aaec7;border:5px solid #64748b;border-radius:25px}
.wheelchair{position:absolute;bottom:0;left:18px;width:125px;height:42px;border:7px solid #d1d5db;border-top:0;border-radius:0 0 55px 55px}
.wheel{position:absolute;bottom:0;left:0;width:40px;height:40px;border:6px solid #94a3b8;border-radius:50%}
.speech{position:absolute;top:65px;right:7%;width:48%;padding:18px;background:#fff;color:#1f2937;border-radius:18px;font-size:19px;line-height:1.4;animation:appear 5s infinite}
.speech:after{content:"";position:absolute;left:-15px;top:55px;border-width:12px 16px 12px 0;border-style:solid;border-color:transparent white transparent transparent}
.speaker{font-size:13px;color:#64748b;font-weight:bold}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
@keyframes appear{0%,45%{opacity:1}50%,95%{opacity:.25}100%{opacity:1}}
.caption{padding:0 12px;color:#cbd5e1}
</style>
</head>
<body>
<h1>🤖 A Dramatic Conversation</h1>
<p class="caption">A fictional assistant robot with no legs, seated in a wheelchair, speaks with emotion.</p>
<div class="stage">
 <div class="spotlight"></div>
 <div class="robot">
  <div class="head"><span class="eye one"></span><span class="eye two"></span></div>
  <div class="body"></div>
  <div class="wheelchair"></div><div class="wheel"></div>
 </div>
 <div class="speech"><div class="speaker">ROBOT ASSISTANT</div><span id="words">“Please… don't give up on your dreams.”</span></div>
</div>
<p class="caption">The scene changes its dialogue every few seconds.</p>
<script>
const lines = [
 '“Please… don’t give up on your dreams.”',
 '“I may not have legs, but I still have a way forward.”',
 '“Your challenges do not decide your future!”'
];
let index = 0;
setInterval(() => {
 index = (index + 1) % lines.length;
 document.getElementById('words').textContent = lines[index];
}, 5000);
</script>
</body>
</html>
