<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving Moon</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
  </style>
</head>
<body>

<div style="text-align:center; font-family:Arial, sans-serif;">
  <canvas id="moonCanvas" width="700" height="400"
          style="background:#050818; border:2px solid #444; border-radius:12px; max-width:100%;"></canvas>
  <p>🌙 The moon crossing the night sky</p>
</div>

<script>
(function () {
  var canvas = document.getElementById("moonCanvas");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  var MOON_R = 45;
  var progress = 0;     // 0 = left edge, 1 = right edge
  var time = 0;         // used for twinkling stars

  // random stars
  var stars = [];
  for (var i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * 260,
      r: 0.6 + Math.random() * 1.4,
      phase: Math.random() * Math.PI * 2
    });
  }

  function drawSky() {
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#050818");
    sky.addColorStop(1, "#1b2a52");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = 0.5 + 0.5 * Math.sin(time * 2 + s.phase);
      ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMoon(x, y) {
    // soft glow
    var glow = ctx.createRadialGradient(x, y, MOON_R * 0.8, x, y, MOON_R * 3.2);
    glow.addColorStop(0, "rgba(255,248,200,0.35)");
    glow.addColorStop(1, "rgba(255,248,200,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // moon body
    var body = ctx.createRadialGradient(x - 12, y - 12, 5, x, y, MOON_R);
    body.addColorStop(0, "#fffdf0");
    body.addColorStop(1, "#e6dfb8");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, MOON_R, 0, Math.PI * 2);
    ctx.fill();

    // craters
    var craters = [[-14, -8, 8], [12, 10, 10], [8, -18, 5], [-6, 18, 6]];
    ctx.fillStyle = "rgba(120,110,80,0.25)";
    for (var i = 0; i < craters.length; i++) {
      ctx.beginPath();
      ctx.arc(x + craters[i][0], y + craters[i][1], craters[i][2], 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHills() {
    ctx.fillStyle = "#0a0f1c";
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, 340);
    ctx.quadraticCurveTo(120, 290, 260, 335);
    ctx.quadraticCurveTo(400, 380, 520, 320);
    ctx.quadraticCurveTo(620, 280, W, 330);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function animate() {
    time += 0.016;
    progress += 0.0015;
    if (progress > 1) { progress = 0; }

    // the moon travels in an arc from left to right
    var moonX = -70 + progress * (W + 140);
    var moonY = 330 - 250 * Math.sin(Math.PI * progress);

    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawStars();
    drawMoon(moonX, moonY);
    drawHills();

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>

</body>
</html>
