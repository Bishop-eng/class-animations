<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving Car</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
  </style>
</head>
<body>

<div style="text-align:center; font-family:Arial, sans-serif;">
  <canvas id="carCanvas" width="700" height="320"
          style="background:#bfe6ff; border:2px solid #444; border-radius:12px; max-width:100%;"></canvas>
  <p>🚗 A car driving along the road</p>
</div>

<script>
(function () {
  var canvas = document.getElementById("carCanvas");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  var ROAD_Y = 220;              // top edge of the road
  var GROUND_Y = ROAD_Y + 50;    // where the tires touch the road
  var WHEEL_R = 22;
  var carX = -100;
  var speed = 3;
  var wheelAngle = 0;
  var dashOffset = 0;
  var cloudShift = 0;

  /* ---------- helpers ---------- */
  function circle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawCloud(x, y, s) {
    circle(x, y, 18 * s, "#ffffff");
    circle(x + 20 * s, y - 10 * s, 22 * s, "#ffffff");
    circle(x + 44 * s, y, 18 * s, "#ffffff");
  }

  /* ---------- scene ---------- */
  function drawBackground() {
    // sun
    circle(610, 60, 34, "#ffe066");

    // clouds
    drawCloud(((120 + cloudShift) % (W + 160)) - 80, 70, 1);
    drawCloud(((420 + cloudShift) % (W + 160)) - 80, 50, 0.8);

    // hills
    ctx.fillStyle = "#9bd8a5";
    ctx.beginPath();
    ctx.moveTo(0, ROAD_Y);
    ctx.quadraticCurveTo(160, 120, 320, ROAD_Y);
    ctx.quadraticCurveTo(500, 140, W, ROAD_Y);
    ctx.closePath();
    ctx.fill();

    // road
    ctx.fillStyle = "#4a4a4a";
    ctx.fillRect(0, ROAD_Y, W, H - ROAD_Y);

    // moving dashed center line
    ctx.save();
    ctx.setLineDash([30, 24]);
    ctx.lineDashOffset = dashOffset;
    ctx.strokeStyle = "#f5f5f5";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, ROAD_Y + 68);
    ctx.lineTo(W, ROAD_Y + 68);
    ctx.stroke();
    ctx.restore();
  }

  function drawWheel(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(wheelAngle);
    circle(0, 0, WHEEL_R, "#222222");
    circle(0, 0, 12, "#cfd8dc");
    ctx.strokeStyle = "#78909c";
    ctx.lineWidth = 3;
    for (var i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 10);
      ctx.stroke();
    }
    circle(0, 0, 3, "#546e7a");
    ctx.restore();
  }

  function drawCar(x) {
    ctx.save();
    ctx.translate(x, GROUND_Y);

    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 90, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    ctx.fillStyle = "#e53935";
    rr(-80, -64, 160, 44, 12);
    ctx.fill();

    // cabin
    ctx.fillStyle = "#c62828";
    ctx.beginPath();
    ctx.moveTo(-48, -64);
    ctx.lineTo(-30, -96);
    ctx.lineTo(28, -96);
    ctx.lineTo(52, -64);
    ctx.closePath();
    ctx.fill();

    // windows
    ctx.fillStyle = "#a9dcf7";
    ctx.beginPath();
    ctx.moveTo(-40, -66);
    ctx.lineTo(-26, -90);
    ctx.lineTo(-4, -90);
    ctx.lineTo(-4, -66);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(4, -66);
    ctx.lineTo(4, -90);
    ctx.lineTo(24, -90);
    ctx.lineTo(42, -66);
    ctx.closePath();
    ctx.fill();

    // door line
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, -62);
    ctx.lineTo(-4, -26);
    ctx.stroke();

    // lights
    circle(76, -48, 5, "#fff176");
    circle(-76, -48, 5, "#ff8a80");

    // wheels
    drawWheel(-48, -WHEEL_R);
    drawWheel(48, -WHEEL_R);

    ctx.restore();
  }

  /* ---------- animation ---------- */
  function animate() {
    carX += speed;
    if (carX > W + 100) { carX = -100; }
    wheelAngle += speed / WHEEL_R;
    dashOffset += speed;
    cloudShift += 0.3;

    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawCar(carX);

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>

</body>
</html>
