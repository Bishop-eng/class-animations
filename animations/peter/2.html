<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Rotating</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 50%,#1d2130 0,#0d0f16 45%,#06070a 80%);font-family:system-ui,-apple-system,sans-serif}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .hud{position:fixed;left:0;right:0;top:18px;text-align:center;color:#8a90a8;font-size:12px;letter-spacing:.32em;font-weight:600}
  .deg{position:fixed;left:0;right:0;bottom:22px;text-align:center;color:#cfd3e6;font:600 13px ui-monospace,Menlo,monospace;letter-spacing:.2em}
  .deg b{color:#ffcc4d;font-weight:600}
</style>
</head>
<body>
<svg viewBox="-330 -340 660 680" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="room" cx="0" cy="0" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2130"/><stop offset=".6" stop-color="#0d0f16"/><stop offset="1" stop-color="#06070a"/>
    </radialGradient>
    <radialGradient id="disc" cx="-60" cy="-80" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3f52"/><stop offset=".7" stop-color="#22252f"/><stop offset="1" stop-color="#16181f"/>
    </radialGradient>
    <radialGradient id="spot" cx="0" cy="0" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- paint: dark at the flanks, bright along the spine -->
    <linearGradient id="paint" x1="-80" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e0710"/><stop offset=".18" stop-color="#b3121f"/>
      <stop offset=".5" stop-color="#ff3b47"/><stop offset=".82" stop-color="#b3121f"/><stop offset="1" stop-color="#5e0710"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="-30" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a55"/><stop offset="1" stop-color="#a50f1b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="-70" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a3a55"/><stop offset=".5" stop-color="#0c1220"/><stop offset="1" stop-color="#1d2a40"/>
    </linearGradient>
    <radialGradient id="headGlow"><stop offset="0" stop-color="#eaf4ff" stop-opacity=".9"/><stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="tailGlow"><stop offset="0" stop-color="#ff4040" stop-opacity=".8"/><stop offset="1" stop-color="#ff0000" stop-opacity="0"/></radialGradient>
    <radialGradient id="sheen" cx="-120" cy="-160" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>

    <!-- right half of the body; the left half is a mirror -->
    <path id="half" d="M0 -156 C26 -156 50 -152 60 -138 C68 -124 71 -106 70 -86 C69 -64 59 -44 58 -14 C57 16 73 36 74 76 C75 108 70 132 58 145 C46 154 22 156 0 156 Z"/>
    <clipPath id="bodyClip"><use href="#half"/><use href="#half" transform="scale(-1,1)"/></clipPath>
    <g id="tyre">
      <rect x="-12" y="-25" width="24" height="50" rx="7" fill="#0b0b0e"/>
    </g>
  </defs>


  <!-- turntable -->
  <circle r="292" fill="#0a0b10"/>
  <circle r="286" fill="url(#disc)"/>
  <g id="rings" fill="none" stroke="#ffffff" stroke-opacity=".05">
    <circle r="250"/><circle r="210"/><circle r="170"/><circle r="130"/><circle r="90"/>
  </g>
  <g id="ticks" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></g>
  <circle r="287" fill="none" stroke="#ffcc4d" stroke-opacity=".55" stroke-width="1.5"/>
  <circle r="300" fill="none" stroke="#ffcc4d" stroke-opacity=".12" stroke-width="10" filter="url(#blur4)"/>
  <circle r="300" fill="url(#spot)"/>

  <!-- the car: everything inside rotates about (0,0) -->
  <g id="car">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    <rect x="-86" y="-160" width="172" height="330" rx="70" fill="#000" opacity=".75" filter="url(#blur18)"/>
    <!-- light spill on the floor -->
    <ellipse cx="-38" cy="-182" rx="24" ry="34" fill="url(#headGlow)" opacity=".22"/>
    <ellipse cx="38" cy="-182" rx="24" ry="34" fill="url(#headGlow)" opacity=".22"/>
    <ellipse cx="0" cy="170" rx="60" ry="14" fill="url(#tailGlow)" opacity=".4"/>

    <use href="#tyre" x="-63" y="-98"/><use href="#tyre" x="63" y="-98"/>
    <use href="#tyre" x="-66" y="92"/><use href="#tyre" x="66" y="92"/>

    <!-- body -->
    <g fill="url(#paint)"><use href="#half"/><use href="#half" transform="scale(-1,1)"/></g>

    <g clip-path="url(#bodyClip)">
      <!-- twin racing stripes -->
      <rect x="-17" y="-160" width="12" height="320" fill="#f4f1ea" opacity=".92"/>
      <rect x="5" y="-160" width="12" height="320" fill="#f4f1ea" opacity=".92"/>
      <!-- hood creases and vents -->
      <path d="M-34 -142 Q-40 -110 -38 -76 M34 -142 Q40 -110 38 -76" stroke="#4a0409" stroke-opacity=".5" stroke-width="2" fill="none"/>
      <g fill="#120306"><rect x="-48" y="-118" width="6" height="22" rx="3"/><rect x="42" y="-118" width="6" height="22" rx="3"/></g>
      <!-- side intakes behind the doors -->
      <path d="M-58 18 Q-66 36 -62 58 L-54 56 Q-56 38 -50 22 Z" fill="#120306"/>
      <path d="M58 18 Q66 36 62 58 L54 56 Q56 38 50 22 Z" fill="#120306"/>
      <!-- engine cover louvres -->
      <g stroke="#120306" stroke-width="3" stroke-linecap="round">
        <line x1="-30" y1="84" x2="30" y2="84"/><line x1="-32" y1="94" x2="32" y2="94"/><line x1="-33" y1="104" x2="33" y2="104"/><line x1="-33" y1="114" x2="33" y2="114"/>
      </g>
    </g>

    <!-- greenhouse -->
    <path d="M-42 -66 C-28 -76 28 -76 42 -66 L50 -22 L49 34 C46 62 -46 62 -49 34 L-50 -22 Z" fill="url(#glass)"/>
    <path d="M-34 -64 C-20 -70 6 -71 16 -69 L-30 -30 Z" fill="#ffffff" opacity=".18"/>
    <path d="M-37 -24 C-20 -30 20 -30 37 -24 L36 30 C20 36 -20 36 -36 30 Z" fill="url(#roof)"/>
    <rect x="-17" y="-27" width="12" height="62" fill="#f4f1ea" opacity=".92"/>
    <rect x="5" y="-27" width="12" height="62" fill="#f4f1ea" opacity=".92"/>

    <!-- mirrors -->
    <path d="M-50 -50 L-64 -56 Q-70 -50 -64 -42 L-50 -42 Z" fill="#8e0d18"/>
    <path d="M50 -50 L64 -56 Q70 -50 64 -42 L50 -42 Z" fill="#8e0d18"/>

    <!-- headlights -->
    <path d="M-56 -136 Q-46 -150 -22 -153 L-24 -146 Q-44 -142 -52 -130 Z" fill="#eaf4ff"/>
    <path d="M56 -136 Q46 -150 22 -153 L24 -146 Q44 -142 52 -130 Z" fill="#eaf4ff"/>
    <!-- front splitter -->
    <path d="M-20 -155 Q0 -158 20 -155" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- rear wing -->
    <rect x="-66" y="128" width="132" height="12" rx="4" fill="#141418"/>
    <rect x="-66" y="128" width="132" height="3" rx="1.5" fill="#3a3a44"/>
    <!-- tail light bar -->
    <path d="M-54 147 Q0 156 54 147" stroke="#ff2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- exhausts -->
    <g fill="#2a2a30" stroke="#8a8f9c" stroke-width="1.5"><circle cx="-12" cy="156" r="5"/><circle cx="12" cy="156" r="5"/></g>

    <!-- studio light: counter-rotated so the reflection stays fixed while the car turns -->
    <g clip-path="url(#bodyClip)"><g id="sheenG"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite"/><rect x="-200" y="-200" width="400" height="400" fill="url(#sheen)"/></g></g>
  </g>

  <!-- rotation axis -->
  <circle r="16" fill="none" stroke="#ffcc4d" stroke-opacity=".35" stroke-width="2"/>
  <circle r="5" fill="#ffcc4d"/>
  <line x1="0" y1="-26" x2="0" y2="-14" stroke="#ffcc4d" stroke-width="2"/><line x1="0" y1="14" x2="0" y2="26" stroke="#ffcc4d" stroke-width="2"/>
  <line x1="-26" y1="0" x2="-14" y2="0" stroke="#ffcc4d" stroke-width="2"/><line x1="14" y1="0" x2="26" y2="0" stroke="#ffcc4d" stroke-width="2"/>
</svg>
<div class="hud">CAR ROTATING ABOUT ITS OWN AXIS</div>
<script>
  const NS='http://www.w3.org/2000/svg',ticks=document.getElementById('ticks');
  for(let a=0;a<360;a+=10){const r1=a%90===0?262:274,l=document.createElementNS(NS,'line'),c=Math.cos(a*Math.PI/180),s=Math.sin(a*Math.PI/180);
    l.setAttribute('x1',c*r1);l.setAttribute('y1',s*r1);l.setAttribute('x2',c*284);l.setAttribute('y2',s*284);ticks.appendChild(l)}
</script>
</body>
</html>
