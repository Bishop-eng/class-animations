  <text x="500" y="30" text-anchor="middle" fill="#7b84a8" font-family="system-ui" font-weight="600" font-size="13" letter-spacing="4">"NO LEG" : A SHORT DRAMA</text>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.50s" dur="2.90s"/><text x="60" y="610" fill="#7fc8ff" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">ELENA</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">Marcus. They said I&#x27;d find you up here.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.40s" dur="3.00s"/><text x="60" y="610" fill="#ffb74d" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">MARCUS</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">Then they should&#x27;ve told you to stay away.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="7.40s" dur="3.37s"/><text x="60" y="610" fill="#7fc8ff" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">ELENA</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">Six months. Six months and you won&#x27;t even look at me.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="10.77s" dur="2.91s"/><text x="60" y="610" fill="#ffb74d" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">MARCUS</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">LOOK at me, Elena! What is there to see? Half a man in a</tspan><tspan x="60" dy="34">chair!</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="13.68s" dur="3.13s"/><text x="60" y="610" fill="#7fc8ff" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">ELENA</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">I see the man who carried me out of that fire.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="16.81s" dur="2.93s"/><text x="60" y="610" fill="#ffb74d" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">MARCUS</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">And it took my legs. Both of them. Gone.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="19.75s" dur="2.89s"/><text x="60" y="610" fill="#7fc8ff" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">ELENA</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">It took your legs. Don&#x27;t you dare let it take the rest of</tspan><tspan x="60" dy="34">you.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="22.64s" dur="4.83s"/><text x="60" y="610" fill="#ffb74d" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">MARCUS</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">I used to run every morning. Do you know what it feels</tspan><tspan x="60" dy="34">like to lose the one thing that was yours?</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="27.47s" dur="3.90s"/><text x="60" y="610" fill="#7fc8ff" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">ELENA</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">Then we find a new thing. Together. Wheels, hands,</tspan><tspan x="60" dy="34">whatever it takes.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="31.37s" dur="2.00s"/><text x="60" y="610" fill="#ffb74d" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">MARCUS</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">...Together?</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="33.37s" dur="3.43s"/><text x="60" y="610" fill="#7fc8ff" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">ELENA</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">I didn&#x27;t climb twelve flights of stairs to say goodbye.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="36.80s" dur="3.67s"/><text x="60" y="610" fill="#ffb74d" font-family="system-ui" font-weight="700" font-size="15" letter-spacing="3">MARCUS</text><text x="60" y="645" fill="#eee" font-family="Georgia,serif" font-style="italic" font-size="25"><tspan x="60" dy="0">Then walk with me. Out of this rain. I&#x27;ve got somewhere to</tspan><tspan x="60" dy="34">go.</tspan></text></g>
