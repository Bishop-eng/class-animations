<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon</title><style>html,body{margin:0;height:100%;background:#14161f}body{display:flex;align-items:center;justify-content:center}svg{width:min(96vw,720px);height:auto;border-radius:10px}
.moon{animation:m 12s ease-in-out infinite}@keyframes m{0%{transform:translate(-40px,170px)}50%{transform:translate(150px,40px)}100%{transform:translate(340px,170px)}}
.st circle{animation:t 3s ease-in-out infinite}.st circle:nth-child(2n){animation-delay:1s}.st circle:nth-child(3n){animation-delay:2s}@keyframes t{50%{opacity:.2}}
</style></head><body>
<svg viewBox="0 0 300 220"><rect width="300" height="220" fill="#0b1030"/>
<g class="st" fill="#fff"><circle cx="30" cy="30" r="1.5"/><circle cx="80" cy="70" r="1"/><circle cx="130" cy="20" r="1.5"/><circle cx="210" cy="50" r="1"/><circle cx="260" cy="25" r="1.5"/><circle cx="240" cy="95" r="1"/><circle cx="50" cy="110" r="1"/><circle cx="180" cy="100" r="1.5"/></g>
<g class="moon"><circle r="26" fill="#f4efd6"/><circle cx="-8" cy="-6" r="5" fill="#d9d3b3"/><circle cx="9" cy="9" r="7" fill="#d9d3b3"/></g>
<path d="M0 220 L0 190 L60 175 L130 195 L210 170 L300 190 L300 220Z" fill="#05071a"/></svg>
</body></html>
