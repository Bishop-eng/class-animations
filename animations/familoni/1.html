<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bouncing Ball</title><style>html,body{margin:0;height:100%;background:#14161f}body{display:flex;align-items:center;justify-content:center}svg{width:min(96vw,720px);height:auto;border-radius:10px}
.ball{animation:b 1.2s cubic-bezier(.3,0,.7,1) infinite;transform-origin:150px 190px;transform-box:view-box}
@keyframes b{0%{transform:translateY(0) scale(1,1)}48%{transform:translateY(135px) scale(1,1)}50%{transform:translateY(140px) scale(1.25,.75)}52%{transform:translateY(135px) scale(1,1)}100%{transform:translateY(0) scale(1,1)}}
.sh{animation:s 1.2s cubic-bezier(.3,0,.7,1) infinite;transform-origin:150px 205px;transform-box:view-box}
@keyframes s{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:.7}}
</style></head><body>
<svg viewBox="0 0 300 220"><rect width="300" height="220" fill="#243b55"/><rect y="205" width="300" height="15" fill="#3a5a40"/>
<ellipse class="sh" cx="150" cy="208" rx="30" ry="5" fill="#000"/>
<g class="ball"><circle cx="150" cy="40" r="22" fill="#ff7a3d"/><path d="M135 28 Q150 20 160 30" stroke="#fff" stroke-opacity=".6" stroke-width="4" fill="none" stroke-linecap="round"/></g></svg>
</body></html>
