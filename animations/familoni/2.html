<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moving Car</title><style>html,body{margin:0;height:100%;background:#14161f}body{display:flex;align-items:center;justify-content:center}svg{width:min(96vw,720px);height:auto;border-radius:10px}
