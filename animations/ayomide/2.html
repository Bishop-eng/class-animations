<!DOCTYPE html> <!-- HTML5 page -->
<html> <!-- root element -->
<head> <!-- page settings -->
<title>Moon Orbiting Earth</title> <!-- browser tab title -->
<style> /* CSS starts */
  body { margin: 0; background: #000; } /* no margin, black background */
  canvas { display: block; margin: 20px auto; background: #000; border: 2px solid #444; } /* centred black canvas with grey border */
</style> <!-- CSS ends -->
</head> <!-- end head -->
<body> <!-- visible content -->
<canvas id="c" width="600" height="600"></canvas> <!-- 600x600 drawing area -->
<script> // JavaScript starts
const canvas = document.getElementById("c"); // get the canvas element
const ctx = canvas.getContext("2d"); // get the 2D drawing tool

const cx = canvas.width / 2; // x of the Earth's centre
const cy = canvas.height / 2; // y of the Earth's centre
const orbitRadius = 200; // distance from Earth's centre to the Moon
let angle = 0; // Moon's current angle on its orbit (radians)
const orbitSpeed = 0.02; // how much the angle grows per frame

const stars = []; // list to hold star data
for (let i = 0; i < 120; i++) { // make 120 stars
  stars.push({ x: Math.random() * canvas.width, // random x
               y: Math.random() * canvas.height, // random y
               r: Math.random() * 1.5 }); // random radius up to 1.5px
} // stars are made once so they don't flicker

function drawStars() { // draws all the stars
  ctx.fillStyle = "white"; // white stars
  stars.forEach(s => { // go through every star
    ctx.beginPath(); // new shape
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); // tiny circle
    ctx.fill(); // fill it
  }); // end forEach
} // end drawStars

function drawOrbitPath() { // draws the dashed orbit circle
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; // faint white
  ctx.setLineDash([6, 6]); // dashes: 6px line, 6px gap
  ctx.beginPath(); // new shape
  ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2); // circle around Earth
  ctx.stroke(); // draw outline only
  ctx.setLineDash([]); // back to solid lines
} // end drawOrbitPath

function drawEarth() { // draws the Earth
  ctx.fillStyle = "#1e6fd9"; // blue oceans
  ctx.beginPath(); // new shape
  ctx.arc(cx, cy, 50, 0, Math.PI * 2); // circle radius 50
  ctx.fill(); // fill
  ctx.fillStyle = "#2e9e4f"; // green land
  ctx.beginPath(); ctx.arc(cx - 15, cy - 10, 15, 0, Math.PI * 2); ctx.fill(); // land patch 1
  ctx.beginPath(); ctx.arc(cx + 20, cy + 15, 12, 0, Math.PI * 2); ctx.fill(); // land patch 2
} // end drawEarth

function drawMoon() { // draws the Moon at its current orbit position
  const moonX = cx + orbitRadius * Math.cos(angle); // x on the circle using cosine
  const moonY = cy + orbitRadius * Math.sin(angle); // y on the circle using sine

  ctx.fillStyle = "#cfcfcf"; // light grey Moon
  ctx.beginPath(); // new shape
  ctx.arc(moonX, moonY, 18, 0, Math.PI * 2); // Moon circle radius 18
  ctx.fill(); // fill
  ctx.fillStyle = "#999"; // darker grey craters
  ctx.beginPath(); ctx.arc(moonX - 5, moonY - 4, 4, 0, Math.PI * 2); ctx.fill(); // crater 1
  ctx.beginPath(); ctx.arc(moonX + 6, moonY + 5, 3, 0, Math.PI * 2); ctx.fill(); // crater 2
} // end drawMoon

function animate() { // animation loop
  ctx.clearRect(0, 0, canvas.width, canvas.height); // wipe the previous frame
  drawStars(); // background stars
  drawOrbitPath(); // dashed orbit line
  drawEarth(); // Earth in the middle
  drawMoon(); // Moon at its current angle

  angle += orbitSpeed; // advance the Moon along the orbit
  requestAnimationFrame(animate); // schedule the next frame
} // end animate
animate(); // start the animation
</script> <!-- JavaScript ends -->
</body> <!-- end body -->
</html> <!-- end page -->
