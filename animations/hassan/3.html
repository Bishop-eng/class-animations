<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cat Watching Mouse</title>
    <style>
        body { margin: 0; background: #1e1e1e; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #f4e8c1; border: 3px solid #fff; }
    </style>
</head>
<body>
<canvas id="canvas" width="600" height="400"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const catX = 300, catY = 200;
    let angle = 0;
    const orbitRadius = 140;

    function drawCat(mouseX, mouseY) {
        // Cat Ears
        ctx.fillStyle = '#d97724'; // Ginger cat color
        ctx.beginPath(); ctx.moveTo(catX - 45, catY - 25); ctx.lineTo(catX - 30, catY - 75); ctx.lineTo(catX - 5, catY - 40); ctx.fill();
        ctx.beginPath(); ctx.moveTo(catX + 45, catY - 25); ctx.lineTo(catX + 30, catY - 75); ctx.lineTo(catX + 5, catY - 40); ctx.fill();

        // Cat Head
        ctx.beginPath(); ctx.arc(catX, catY, 50, 0, Math.PI * 2); ctx.fill();

        // Eyes (White part)
        const leftEyeX = catX - 18, rightEyeX = catX + 18, eyeY = catY - 10;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(leftEyeX, eyeY, 13, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(rightEyeX, eyeY, 13, 0, Math.PI * 2); ctx.fill();

        // Pupils tracking the mouse
        const angleToMouse = Math.atan2(mouseY - eyeY, mouseX - catX);
        const pupilOffset = 6;
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(leftEyeX + Math.cos(angleToMouse) * pupilOffset, eyeY + Math.sin(angleToMouse) * pupilOffset, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(rightEyeX + Math.cos(angleToMouse) * pupilOffset, eyeY + Math.sin(angleToMouse) * pupilOffset, 6, 0, Math.PI * 2); ctx.fill();

        // Cat Nose
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath(); ctx.arc(catX, catY + 10, 6, 0, Math.PI * 2); ctx.fill();
    }

    function drawMouse(x, y, currentAngle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(currentAngle + Math.PI / 2); // Point forward along the circle

        // 1. Pink Wiggling Tail
        ctx.strokeStyle = '#ff6b6b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 20);
        ctx.quadraticCurveTo(15, 35, -8, 50);
        ctx.stroke();

        // 2. Dark Gray Mouse Body
        ctx.fillStyle = '#4a4e69';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 24, 0, 0, Math.PI * 2);
        ctx.fill();

        // 3. Round Mouse Ears
        ctx.fillStyle = '#22223b';
        ctx.beginPath(); ctx.arc(-12, -8, 8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(12, -8, 8, 0, Math.PI * 2); ctx.fill();

        // Inner Pink Ears
        ctx.fillStyle = '#ff9999';
        ctx.beginPath(); ctx.arc(-12, -8, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(12, -8, 4, 0, Math.PI * 2); ctx.fill();

        // 4. Pointy Pink Nose at the front
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath(); ctx.arc(0, -24, 4, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
    }

    function animate() {
        ctx.clearRect(0, 0, 600, 400);

        // Optional: Faint dotted path so you can see the circle track
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(catX, catY, orbitRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        const mouseX = catX + Math.cos(angle) * orbitRadius;
        const mouseY = catY + Math.sin(angle) * orbitRadius;

        drawCat(mouseX, mouseY);
        drawMouse(mouseX, mouseY, angle);

        angle += 0.03;
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
