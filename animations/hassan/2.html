<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rotating Car on Axis</title>
    <style>
        body { margin: 0; background: #1e1e1e; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #333; border: 3px solid #fff; }
    </style>
</head>
<body>
<canvas id="canvas" width="600" height="400"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let angle = 0;

    function animate() {
        ctx.clearRect(0, 0, 600, 400);

        // Draw center pivot platform
        ctx.fillStyle = '#555';
        ctx.beginPath(); ctx.arc(300, 200, 110, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        // Move origin to center of canvas (the axis)
        ctx.translate(300, 200);
        ctx.rotate(angle);

        // Wheels
        ctx.fillStyle = '#000';
        ctx.fillRect(-55, -45, 25, 10); // Top-left
        ctx.fillRect(30, -45, 25, 10);  // Top-right
        ctx.fillRect(-55, 35, 25, 10);  // Bottom-left
        ctx.fillRect(30, 35, 25, 10);   // Bottom-right

        // Car Body
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.roundRect(-70, -35, 140, 70, 12);
        ctx.fill();

        // Windshield & Rear Window
        ctx.fillStyle = '#a8dadc';
        ctx.fillRect(20, -28, 25, 56);  // Front windshield
        ctx.fillRect(-50, -28, 18, 56); // Rear window

        // Headlights
        ctx.fillStyle = '#fff3b0';
        ctx.fillRect(65, -28, 5, 12);
        ctx.fillRect(65, 16, 5, 12);

        // Center Axis Pin
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();

        ctx.restore();

        angle += 0.03; // Rotation speed
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
