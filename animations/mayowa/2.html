<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Rotating About Its Axis</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#101a2a;color:#edf5ff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
main{width:min(100%,1000px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(1.3rem,3vw,2rem);margin:0 0 5px}.sub{margin:0;color:#aebed0}.badge{border:1px solid #55708e;border-radius:25px;padding:8px 13px}
.stage{overflow:hidden;border:1px solid #3c536e;border-radius:16px;background:#080e17}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:8px;padding:12px 17px;font-weight:bold;background:#69d2ff;color:#092033;cursor:pointer}
button.alt{background:#293e58;color:#fff;border:1px solid #55708e}button:disabled{opacity:.45}
#status{color:#b8c7d8;margin-left:auto;font-size:.9rem}.tip{font-size:.9rem;color:#c2d0df;line-height:1.5}
</style></head><body><main>
<header><div><h1>Car Rotating About Its Axis</h1><p class="sub">A stylized car makes continuous 360-degree turns.</p></div><span class="badge">CPE 505 · Animation</span></header>
<div class="stage"><canvas id="scene" width="1280" height="720"></canvas></div>
<div class="controls"><button id="record">● Record video</button><button id="stop" class="alt" disabled>Stop &amp; download</button><button id="pause" class="alt">Pause animation</button><span id="status">Animation playing</span></div>
<p class="tip">To save a video, press <b>Record video</b>, let the animation play, then press <b>Stop &amp; download</b>. A WebM video will be saved to your Downloads folder. Use Chrome or Edge for best results.</p>
</main><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),W=1280,H=720;
const FILE_NAME='rotating_car.webm';let running=true,raf=0,start=performance.now(),recorder=null,chunks=[];
function txt(s,x,y,size=24,color='#fff',align='left',weight='600'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Arial`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function ln(x,y,X,Y,c='#fff',w=4){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function background(title,sub){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1b3652');g.addColorStop(1,'#080e18');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);txt(title,50,60,30);txt(sub,50,96,18,'#b6cde0','left','400')}
function frame(){if(!running)return;draw((performance.now()-start)/1000);raf=requestAnimationFrame(frame)}
function play(){running=true;start=performance.now();cancelAnimationFrame(raf);frame()}
function pause(){running=false;cancelAnimationFrame(raf)}
document.getElementById('pause').onclick=()=>{if(running){pause();document.getElementById('pause').textContent='Resume animation'}else{play();document.getElementById('pause').textContent='Pause animation'}};
document.getElementById('record').onclick=()=>{
 if(!canvas.captureStream||!window.MediaRecorder){alert('Please use Chrome or Edge to record this animation.');return}
 chunks=[];let stream=canvas.captureStream(30),opts={};
 if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9'))opts.mimeType='video/webm;codecs=vp9';
 recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=FILE_NAME;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);document.getElementById('status').textContent='Downloaded! Check your Downloads folder.';document.getElementById('record').disabled=false;document.getElementById('stop').disabled=true};
 recorder.start();document.getElementById('record').disabled=true;document.getElementById('stop').disabled=false;document.getElementById('status').textContent='Recording…';
};
document.getElementById('stop').onclick=()=>{if(recorder&&recorder.state!=='inactive')recorder.stop()};

function draw(t){
 background('360° ROTATING CAR','The vehicle continuously rotates around its vertical centre axis.');
 ctx.fillStyle='#111f2c';ctx.fillRect(0,500,W,220);
 ctx.beginPath();ctx.ellipse(640,520,330,75,0,0,7);ctx.setLineDash([12,12]);ctx.strokeStyle='#42617a';ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
 let a=t*.8,scale=Math.max(.13,Math.abs(Math.cos(a)));ctx.save();ctx.translate(640,390);ctx.scale(scale,1);
 // tyres
 for(let x of [-185,185]){ctx.fillStyle='#080d14';ctx.beginPath();ctx.ellipse(x,95,58,62,0,0,7);ctx.fill();ctx.fillStyle='#a8bac9';ctx.beginPath();ctx.arc(x,95,27,0,7);ctx.fill();ctx.fillStyle='#36495a';ctx.beginPath();ctx.arc(x,95,11,0,7);ctx.fill()}
 let g=ctx.createLinearGradient(0,-30,0,120);g.addColorStop(0,'#ff7964');g.addColorStop(1,'#a91f2e');ctx.fillStyle=g;
 ctx.beginPath();ctx.moveTo(-250,40);ctx.quadraticCurveTo(-230,-25,-150,-35);ctx.lineTo(-95,-115);ctx.quadraticCurveTo(-60,-150,15,-150);ctx.lineTo(130,-125);ctx.quadraticCurveTo(190,-90,215,-35);ctx.lineTo(250,10);ctx.lineTo(235,75);ctx.quadraticCurveTo(0,120,-235,75);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffc0b5';ctx.lineWidth=4;ctx.stroke();
 ctx.fillStyle='#8ed8ed';ctx.beginPath();ctx.moveTo(-125,-45);ctx.lineTo(-75,-112);ctx.quadraticCurveTo(-55,-132,10,-130);ctx.lineTo(20,-45);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(32,-130);ctx.lineTo(116,-112);ctx.quadraticCurveTo(155,-92,175,-45);ctx.lineTo(35,-45);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff0ad';ctx.fillRect(-220,12,30,16);ctx.fillRect(190,12,30,16);ctx.restore();
 ctx.setLineDash([7,8]);ln(640,165,640,585,'#80d9ff',2);ctx.setLineDash([]);txt('VERTICAL ROTATION AXIS',660,190,18,'#8bdcff');txt('360°',640,650,30,'#fff','center');
}
play();
</script></body></html>
