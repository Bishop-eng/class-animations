<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car — 360 Degree Rotation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0b1220,#253a55);font-family:system-ui;color:#f4f7fb}
main{width:min(960px,94vw);text-align:center;padding:28px 16px}h1{font-size:clamp(1.8rem,4vw,3rem);margin:0 0 8px}p{color:#c3d1e2;margin:0 0 24px}
.stage{height:min(560px,68vh);min-height:400px;border-radius:28px;background:radial-gradient(ellipse at 50% 58%,#50677c,#1c2b40 68%);position:relative;overflow:hidden;display:grid;place-items:center;perspective:1000px;border:1px solid #ffffff20;box-shadow:0 25px 70px #0007}
.floor{position:absolute;left:-20%;right:-20%;height:42%;bottom:-13%;background:repeating-linear-gradient(90deg,#ffffff0a 0 2px,transparent 2px 75px),linear-gradient(#31475b,#182637);transform:rotateX(68deg)}
.axis{position:absolute;width:2px;height:76%;background:linear-gradient(transparent,#9ac5efaa,transparent);top:12%;left:50%;box-shadow:0 0 15px #9ac5ef}
.car-wrap{width:330px;height:190px;position:relative;transform-style:preserve-3d;animation:spin 6s linear infinite}.car{position:absolute;inset:0;transform-style:preserve-3d}
.cabin{position:absolute;left:77px;top:20px;width:180px;height:90px;background:linear-gradient(135deg,#e9f2f8,#7897b3 55%,#324b64);clip-path:polygon(20% 0,78% 0,100% 100%,0 100%);border:2px solid #d8e8f7;transform:translateZ(0)}
.window{position:absolute;inset:9px 18px 13px;background:linear-gradient(120deg,#18344c,#77a3c1);clip-path:polygon(20% 0,75% 0,100% 100%,0 100%)}
.hood{position:absolute;left:0;top:87px;width:330px;height:76px;border-radius:48px 50px 25px 25px;background:linear-gradient(#fa5e58,#a91e2a 55%,#681723);box-shadow:inset 0 8px #ff9b87;transform:translateZ(45px)}
.grille{position:absolute;left:135px;top:115px;width:60px;height:25px;border-radius:5px;background:#242d37;border:3px solid #f7a09a}
.lamp{position:absolute;top:105px;width:30px;height:13px;background:#fff4bc;border-radius:50%;box-shadow:0 0 18px #fff4bc}.lamp.l{left:25px}.lamp.r{right:25px}
.wheel{position:absolute;top:115px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#aab8c6 0 18%,#26313c 20% 45%,#090d12 47%);border:5px solid #111820}.wheel.l{left:45px;transform:translateZ(49px)}.wheel.r{right:45px;transform:translateZ(49px)}
.shadow{position:absolute;width:280px;height:45px;left:50%;top:65%;transform:translateX(-50%);background:#0008;filter:blur(16px);border-radius:50%}
@keyframes spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}.paused *{animation-play-state:paused!important}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:99px;padding:11px 18px;background:#d9e9f7;color:#17283a;font-weight:700;cursor:pointer}
</style></head><body><main><h1>360° Car Rotation</h1><p>The car rotates continuously around one fixed vertical axis, staying in the same spot.</p>
<section class="stage" id="stage"><div class="floor"></div><div class="axis"></div><div class="shadow"></div><div class="car-wrap"><div class="car"><div class="cabin"><div class="window"></div></div><div class="hood"></div><div class="grille"></div><div class="lamp l"></div><div class="lamp r"></div><div class="wheel l"></div><div class="wheel r"></div></div></div></section>
<div class="controls"><button onclick="document.getElementById('stage').classList.toggle('paused');this.textContent=this.textContent==='Pause rotation'?'Resume rotation':'Pause rotation'">Pause rotation</button><button onclick="document.querySelector('.car-wrap').style.animationDuration='2.5s'">Faster</button><button onclick="document.querySelector('.car-wrap').style.animationDuration='9s'">Slower</button></div></main></body></html>
