<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving Car Animation</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#8bd0f0 0 65%,#5b9c53 65%);font-family:system-ui,sans-serif;color:#183047}
main{width:min(960px,94vw);text-align:center;padding:24px 12px}
h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.7rem)}
p{margin:0 0 22px;color:#24485b}
.scene{height:min(500px,62vh);min-height:330px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#9bd9f5 0 67%,#79b96a 67% 100%);box-shadow:0 18px 45px #16334a44}
.sun{position:absolute;right:9%;top:9%;width:66px;height:66px;border-radius:50%;background:#ffe99b;box-shadow:0 0 35px #ffe99b99}
.cloud{position:absolute;top:18%;left:-180px;width:130px;height:38px;border-radius:50px;background:#ffffffcc;animation:cloud 18s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#ffffffdd;border-radius:50%}
.cloud:before{width:48px;height:48px;left:22px;top:-22px}.cloud:after{width:60px;height:55px;right:18px;top:-28px}
.cloud.two{top:32%;animation-duration:25s;animation-delay:-11s;transform:scale(.75)}
.road{position:absolute;left:0;right:0;bottom:0;height:31%;background:#444b54;border-top:8px solid #c6c6b9}
.road:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:5px dashed #f7e7a5}
.car{position:absolute;left:-230px;bottom:15%;width:190px;height:95px;animation:drive 7s linear infinite}
.body{position:absolute;bottom:18px;left:0;width:190px;height:48px;border-radius:25px 38px 13px 14px;background:linear-gradient(#ff725c,#d8322e);box-shadow:inset 0 7px #ffb09b}
.roof{position:absolute;left:43px;bottom:60px;width:105px;height:48px;border-radius:48px 48px 0 0;background:#e94a42;clip-path:polygon(20% 0,78% 0,100% 100%,0 100%)}
.window{position:absolute;left:57px;bottom:67px;width:77px;height:29px;background:linear-gradient(120deg,#bce9f4,#47758d);clip-path:polygon(20% 0,75% 0,100% 100%,0 100%)}
.light{position:absolute;right:0;bottom:37px;width:13px;height:13px;border-radius:50%;background:#fff5b2;box-shadow:0 0 12px #fff5b2}
.wheel{position:absolute;bottom:0;width:42px;height:42px;border:7px solid #202832;border-radius:50%;background:radial-gradient(circle,#c5ced4 0 25%,#64717b 27% 45%,#202832 48%)}
.wheel.one{left:28px}.wheel.two{right:28px}
@keyframes drive{from{left:-230px}to{left:calc(100% + 230px)}}
@keyframes cloud{from{left:-180px}to{left:calc(100% + 180px)}}
.controls{display:flex;justify-content:center;gap:10px;margin-top:17px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:11px 19px;background:#183b53;color:white;font-weight:700;cursor:pointer}
.paused *{animation-play-state:paused!important}
</style>
</head>
<body><main>
<h1>Car Moving Across the Screen</h1><p>The car drives from the left edge to the right edge, then repeats.</p>
<section class="scene" id="scene">
<div class="sun"></div><div class="cloud"></div><div class="cloud two"></div>
<div class="road"></div>
<div class="car"><div class="roof"></div><div class="window"></div><div class="body"></div><div class="light"></div><div class="wheel one"></div><div class="wheel two"></div></div>
</section>
<div class="controls">
<button id="toggle" onclick="const s=document.getElementById('scene');s.classList.toggle('paused');this.textContent=s.classList.contains('paused')?'Resume animation':'Pause animation'">Pause animation</button>
<button onclick="document.querySelector('.car').style.animationDuration='3.5s'">Faster</button>
<button onclick="document.querySelector('.car').style.animationDuration='11s'">Slower</button>
</div>
</main></body></html>
