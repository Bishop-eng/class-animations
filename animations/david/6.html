*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b16;color:#f4f0eb;font-family:Georgia,serif;display:grid;place-items:center}

<div class="controls"><button id="play">Play conversation</button><button onclick="document.getElementById('scene').classList.toggle('paused');this.textContent=this.textContent==='Pause scene'?'Resume scene':'Pause scene'">Pause scene</button></div></main>
<script>
const lines=[
["You","“You keep looking at the chair. Look at me. I’m still here.”"],
["Other person","“I didn’t know what to say. I was afraid I’d say the wrong thing.”"],
["You","“Then say something honest. Don’t turn me into a tragedy.”"],
["Other person","“I miss how things used to be. I’m sorry.”"],
["You","“So do I. But my life didn’t end when it changed.”"],
["Other person","“What do you need from me?”"],
["You","“Stay. Listen. And when I ask for help, help me—not your idea of me.”"],
["Other person","“I can do that. I’m here.”"]
];
let i=0,timer=null;
const speaker=document.getElementById('speaker'),line=document.getElementById('line'),btn=document.getElementById('play');
function show(){speaker.textContent=lines[i][0];line.textContent=lines[i][1];i=(i+1)%lines.length;}
btn.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;btn.textContent='Play conversation';return;}show();timer=setInterval(show,3600);btn.textContent='Stop conversation';});
</script></body></html>
