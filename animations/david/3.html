<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat & Mouse — Orbiting Mouse Animation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#304b61,#101a2b 72%);font-family:system-ui;color:#f7f4ec}
main{width:min(940px,94vw);text-align:center;padding:28px 16px}h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,3rem)}p{color:#c6d4df;margin:0 0 22px}
.scene{height:min(540px,65vh);min-height:390px;position:relative;overflow:hidden;border:1px solid #ffffff22;border-radius:28px;background:linear-gradient(#9dd4ee 0 63%,#5e9b68 63%);box-shadow:0 25px 70px #0007}
.sun{position:absolute;right:9%;top:8%;width:65px;height:65px;border-radius:50%;background:#ffe69b;box-shadow:0 0 55px #ffe69b88}.ground{position:absolute;bottom:0;height:38%;width:100%;background:linear-gradient(#73ad73,#39704b)}
.cat{position:absolute;left:50%;top:56%;width:170px;height:125px;transform:translate(-50%,-50%);z-index:3;animation:watch 3s ease-in-out infinite}
.body{position:absolute;left:26px;top:42px;width:112px;height:72px;border-radius:48% 50% 40% 40%;background:#f2a34e;box-shadow:inset -9px -8px #cf7937}
.head{position:absolute;left:78px;top:5px;width:82px;height:75px;border-radius:48%;background:#f5b25f;z-index:2}
.ear{position:absolute;top:-13px;width:34px;height:42px;background:#e99743;clip-path:polygon(50% 0,100% 100%,0 100%)}.ear:after{content:"";position:absolute;inset:9px 8px 5px;background:#e98287;clip-path:polygon(50% 0,100% 100%,0 100%)}.ear.left{left:5px;transform:rotate(-17deg)}.ear.right{right:4px;transform:rotate(17deg)}
.eye{position:absolute;top:33px;width:8px;height:12px;border-radius:50%;background:#20242b}.eye.one{left:22px}.eye.two{right:20px}.nose{position:absolute;top:49px;left:38px;width:9px;height:7px;background:#e47779;clip-path:polygon(50% 100%,0 0,100% 0)}
.whisk{position:absolute;top:52px;left:0;width:32px;height:1px;background:#68452e;transform:rotate(8deg);box-shadow:0 8px #68452e}.whisk.r{left:auto;right:0;transform:rotate(-8deg)}
.tail{position:absolute;left:8px;top:42px;width:64px;height:55px;border:12px solid #e99543;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(-20deg);animation:tail 1.2s ease-in-out infinite alternate}
.leg{position:absolute;bottom:-4px;width:19px;height:32px;background:#d9823b;border-radius:10px}.leg.a{left:44px}.leg.b{left:112px}
.mouse-orbit{position:absolute;left:50%;top:55%;width:330px;height:230px;transform:translate(-50%,-50%);border:1px dashed #ffffff55;border-radius:50%;animation:orbit 5s linear infinite}
.mouse{position:absolute;left:50%;top:-22px;width:48px;height:30px;transform:translateX(-50%);border-radius:55% 50% 45% 45%;background:#aeb8c3;box-shadow:inset -5px -4px #7d8995}
.mouse:before,.mouse:after{content:"";position:absolute;top:-9px;width:15px;height:15px;border-radius:50%;background:#d8a1a2;border:4px solid #aeb8c3}.mouse:before{left:5px}.mouse:after{right:5px}.mouse i{position:absolute;right:-8px;top:18px;width:20px;height:3px;background:#d68b91;border-radius:5px;transform:rotate(25deg)}
@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes tail{to{transform:rotate(15deg)}}@keyframes watch{0%,100%{transform:translate(-50%,-50%) rotate(0)}50%{transform:translate(-50%,-50%) rotate(3deg)}}
.note{position:absolute;bottom:14px;left:0;right:0;font-size:.9rem;color:#f4fff4;text-shadow:0 1px 3px #173}
button{margin-top:18px;border:0;border-radius:99px;padding:11px 20px;background:#ffe69b;color:#202b35;font-weight:700;cursor:pointer}.paused *{animation-play-state:paused!important}
</style></head><body><main><h1>The Cat & the Mouse</h1><p>A curious cat keeps its eyes on a mouse circling around it.</p>
<section class="scene" id="scene"><div class="sun"></div><div class="ground"></div><div class="mouse-orbit"><div class="mouse"><i></i></div></div>
<div class="cat"><div class="tail"></div><div class="body"></div><div class="leg a"></div><div class="leg b"></div><div class="head"><div class="ear left"></div><div class="ear right"></div><div class="eye one"></div><div class="eye two"></div><div class="nose"></div><div class="whisk"></div><div class="whisk r"></div></div></div><div class="note">The mouse is making its rounds… the cat is watching every move.</div></section>
<button onclick="document.getElementById('scene').classList.toggle('paused');this.textContent=this.textContent==='Pause animation'?'Play animation':'Pause animation'">Pause animation</button></main></body></html>
